<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spells — Campaign Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&amp;family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <nav class="site-nav" id="site-nav" aria-label="Main"></nav>
    <h1 class="section-title">Spells</h1>
    <p class="intro" style="margin-bottom:1rem">
      A small SRD 5.1 starter list. Filter by class and level. Add more in
      <code>data/spells.js</code>.
    </p>
    <div class="filters">
      <label>Class
        <select id="filter-class">
          <option value="">All classes</option>
        </select>
      </label>
      <label>Level
        <select id="filter-level">
          <option value="">All levels</option>
        </select>
      </label>
    </div>
    <div class="table-wrap">
      <table class="spells" id="spell-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Level</th>
            <th>School</th>
            <th>Casting time</th>
            <th>Range</th>
            <th>Components</th>
            <th>Duration</th>
            <th>Classes</th>
          </tr>
        </thead>
        <tbody id="spell-body"></tbody>
      </table>
    </div>
    <p id="spell-empty" class="empty-note" hidden>No spells match these filters.</p>
    <footer class="site-footer">D&amp;D 5e Campaign Hub · rough draft · edit <code>data/spells.js</code></footer>
  </div>
  <script src="js/common.js"></script>
  <script src="data/spells.js"></script>
  <script src="js/spells.js"></script>
  <script>renderNav("spells");</script>
</body>
</html>
